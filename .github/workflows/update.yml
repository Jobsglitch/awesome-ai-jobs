name: Rebuild the list

on:
  schedule:
    - cron: "23 5 * * *"   # every day, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: rebuild

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Standard library only, so the runner's own Python is enough.
      # A failed rebuild exits non-zero and leaves yesterday's list in place.
      - run: python3 build_list.py
        env:
          JOBSGLITCH_API_KEY: ${{ secrets.JOBSGLITCH_API_KEY }}
      - name: Commit the new list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md jobs.json
          git diff --cached --quiet || git commit -m "Rebuild list $(date -u +%F)"
          git push
